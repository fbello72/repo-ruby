# MySQL 8. Gem: mysql2 (requer libmysqlclient-dev para compilar).
#
# Credenciais vêm de variáveis de ambiente (nunca coloque a senha neste arquivo):
#   DB_USER, DB_PASSWORD, DB_HOST, DB_PORT
#
# Se usar MariaDB em vez de MySQL 8, troque a collation por utf8mb4_general_ci.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_0900_ai_ci
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USER") { "repo_ruby" } %>
  password: <%= ENV["DB_PASSWORD"] %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DB_PORT") { 3306 } %>

development:
  <<: *default
  database: repo_ruby_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: repo_ruby_test

# Em produção o Rails 8 usa um banco para o app e um para cada Solid
# (cache, queue, cable). Os nomes primary/cache/queue/cable são referenciados
# por config/cache.yml, config/queue.yml, config/cable.yml e production.rb.
production:
  primary:
    <<: *default
    database: repo_ruby_production
  cache:
    <<: *default
    database: repo_ruby_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: repo_ruby_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: repo_ruby_production_cable
    migrations_paths: db/cable_migrate
